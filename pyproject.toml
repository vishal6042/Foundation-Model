[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homefm"
version = "0.1.0"
description = "HomeFM: a foundation model for smart-home event streams"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
text = ["sentence-transformers>=2.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
